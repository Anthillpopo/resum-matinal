name: Le Tri du jour

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Heures UTC. Le matin : toutes les 30 minutes pour couvrir 6 h 30 à 8 h à Paris, été comme hiver.
    - cron: "0,30 4-7 * * *"
    # Rafraîchissements dans la journée.
    - cron: "0 10,14,18 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: tri-du-jour
  cancel-in-progress: false

jobs:
  construire:
    runs-on: ubuntu-latest
    outputs:
      nombre: ${{ steps.collecte.outputs.nombre }}
      titre: ${{ steps.collecte.outputs.titre }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - id: pages
        uses: actions/configure-pages@v5

      - name: Publier le service d'abonnement sur Cloudflare
        id: worker
        if: github.event_name != 'schedule'
        working-directory: worker
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Cloudflare non configuré : étape ignorée."; exit 0
          fi
          npx --yes wrangler@4 deploy --var ALLOWED_ORIGIN:"${{ steps.pages.outputs.origin }}" 2>&1 | tee deploy.log
          url=$(grep -o 'https://[a-zA-Z0-9.-]*workers\.dev' deploy.log | head -1 || true)
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Préparer la configuration des notifications
        env:
          PUSH_API_URL: ${{ steps.worker.outputs.url }}
        run: node scripts/keys.mjs

      - name: Collecter et trier les actualités
        id: collecte
        run: |
          node scripts/collect.mjs site/news.json
          node -e "const d=require('./site/news.json');const fs=require('fs');fs.appendFileSync(process.env.GITHUB_OUTPUT,'nombre='+d.items.length+'\n'+'titre='+d.items[0].title.replace(/[\r\n]+/g,' ')+'\n')"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deployer:
    needs: construire
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    outputs:
      adresse: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4

  notifier:
    needs: [construire, deployer]
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SITE_URL: ${{ needs.deployer.outputs.adresse }}
      NEWS_COUNT: ${{ needs.construire.outputs.nombre }}
      NEWS_TITLE: ${{ needs.construire.outputs.titre }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Envoyer la notification du matin
        run: node scripts/notify.mjs
